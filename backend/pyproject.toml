[project]
name = "stallkarte_backend"
version = "0.1.0"
description = "Backend for the SiAD Stallkarte"
authors = [
	{ name = "Jeanne Sinn", email = "ninjeanne@icloud.com" },
	{ name = "Matthias Harzer", email = "matthias.harzer03@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
	"fastapi==0.135.3",
	"openpyxl==3.1.5",
	"psycopg2-binary==2.9.11", # PostgreSQL adapter used by SQLAlchemy
	"pydantic==2.12.5",
	"pydantic-settings==2.13.1",
	"python-keycloak==7.1.1",
	"python-multipart==0.0.32",
	"sqlalchemy==2.0.48",
	"uvicorn==0.42.0",
]

[dependency-groups]
dev = [
	"ruff==0.15.7",
	"pytest==9.0.2",
	"ty==0.0.18",
]

[tool.uv]
add-bounds = "exact"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
	"E", # Errors
	"F", # Pyflakes
	"W", # Warnings
	"C90", # Complexity
	"ANN", # Annotations
	"RUF", # Ruff
	"TID", # flake8 tidy imports
]

[tool.ruff.lint.flake8-tidy-imports]
# relative imports seem broken in fastapi
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
	"TID" # allow relative imports in __init__.py
]
