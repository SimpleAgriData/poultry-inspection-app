services:
  db:
    image: postgres:18.0-trixie
    container_name: siad-stallkarte-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: siad
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: siad_stallkarte_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

volumes:
  postgres-data:
    driver: local
